<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans:wght@400;500;700&display=swap"
    />
    <title>cotizador</title>
  </head>
  <body>
    <div id="container">
      <img src="crypto.svg" alt="" />
      <div id="coin-container">
        <form id="coin-form">
          <div class="coin-input-container">
            <label for="coin">ELIGE TU MONEDA</label>
            <select class="coin-input" id="coin">
              <option selected disabled value="">Selecciona una moneda</option>
              <option value="USD">Dolar</option>
              <option value="EUR">Euros</option>
              <option value="ARS">Pesos Argentinos</option>
              <option value="VES">Bolivares</option>
            </select>
          </div>
          <div class="coin-input-container">
            <label for="crypto">ELIGE TU crypto MONEDA</label>
            <select class="coin-input" id="crypto">
              <option selected disabled value="">
                Selecciona una cryptomoneda
              </option>
              <option value="BTC">Bitcoin</option>
              <option value="ETH">Ethereum</option>
              <option value="AXS">AXS</option>
              <option value="BNB">Binance coin</option>
            </select>
          </div>
          <div class="coin-input-container">
            <label for="amount">ELIGE TU CRYPTOMONEDA</label>
            <input
              type="text"
              class="coin-input"
              id="amount"
              placeholder="monto"
            />
          </div>
          <button type="submit" id="form-btn">Cotizar</button>
        </form>
        <div id="coin-info"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
